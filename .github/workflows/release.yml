name: Release Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-deb-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Configure
        run: cmake -S . -B _build -DCPACK_GENERATOR="DEB;RPM;TGZ"

      - name: Build
        run: cmake --build _build

      - name: Package
        run: cmake --build _build --target package

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            _build/*.deb
            _build/*.rpm
            _build/*.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _build/*.deb
            _build/*.rpm
            _build/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B _build -DCPACK_GENERATOR="DragNDrop"

      - name: Build
        run: cmake --build _build

      - name: Package
        run: cmake --build _build --target package

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: _build/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B _build -DCPACK_GENERATOR="WIX" -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build _build --config Release

      - name: Package
        run: cmake --build _build --config Release --target package

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: _build/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
